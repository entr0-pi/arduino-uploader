[project]
name = "esp32-littlefs-nvs-studio"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "esptool==5.1.0",
    "sv-ttk==2.6.1",
    "pyserial==3.5",
    "esp_idf_nvs_partition_gen==0.2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
